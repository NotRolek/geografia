<!doctype html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>

		<!-- Optymalizacja pod Androida i PWA -->
		<meta name="theme-color" content="#0f172a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<link
			rel="manifest"
			href="data:application/manifest+json;base64,eyJuYW1lIjoiQXNpYSBDaGFsbGVuZ2UiLCJzaG9ydF9uYW1lIjoiQXNpYSIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMxMjEyMTIiLCJ0aGVtZV9jb2xvciI6IiMwZjE3MmEiLCJvcmllbnRhdGlvbiI6ImxhbmRzY2FwZSJ9"
		/>

		<title>Azja - Krainy Geograficzne</title>

		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- Leaflet CSS & JS -->
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>

		<!-- Google Fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap"
			rel="stylesheet"
		/>

		<style>
			body {
				font-family: 'Outfit', sans-serif;
				margin: 0;
				padding: 0;
				background-color: #121212;
				overflow: hidden;
				-webkit-tap-highlight-color: transparent;
				user-select: none;
				-webkit-user-select: none;
			}

			#map {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				z-index: 1;
				background-color: #121212;
				cursor: crosshair;
			}

			/* Nowoczesne kontrolki Leafleta ala GeoGuessr */
			.leaflet-control-zoom {
				border: none !important;
				box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5) !important;
				border-radius: 8px !important;
				overflow: hidden;
				margin-bottom: 24px !important;
				margin-right: 24px !important;
			}
			.leaflet-control-zoom a {
				background-color: #1e293b !important;
				color: #f8fafc !important;
				border-bottom: 1px solid #334155 !important;
				width: 36px !important;
				height: 36px !important;
				line-height: 36px !important;
				font-weight: bold !important;
				transition: background-color 0.2s;
			}
			.leaflet-control-zoom a:hover {
				background-color: #334155 !important;
				color: #38bdf8 !important;
			}
			.leaflet-control-attribution {
				background-color: rgba(15, 23, 42, 0.8) !important;
				backdrop-filter: blur(4px);
				border-top-left-radius: 8px;
				font-size: 10px !important;
				color: #94a3b8 !important;
				padding: 2px 8px !important;
			}
			.leaflet-control-attribution a {
				color: #38bdf8 !important;
			}

			/* Warstwy UI */
			.ui-layer {
				position: relative;
				z-index: 10;
			}

			/* Karty w stylu gry */
			.game-card {
				background: linear-gradient(145deg, #1e293b, #0f172a);
				border: 1px solid #334155;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
			}
			.menu-card {
				background: #1e293b;
				border: 2px solid transparent;
				transition: all 0.2s ease-in-out;
			}
			.menu-card:hover {
				transform: translateY(-4px);
				border-color: #38bdf8;
				box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
				background: #233147;
			}

			/* Etykiety na mapie */
			.study-label {
				background: #0f172a;
				border: 1px solid #334155;
				color: #f8fafc;
				font-weight: 800;
				border-radius: 4px;
				padding: 2px 6px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
			}

			.fade-enter {
				opacity: 0;
				transform: translateY(10px);
			}
			.fade-enter-active {
				opacity: 1;
				transform: translateY(0);
				transition: all 0.3s ease;
			}
			.fade-exit {
				opacity: 1;
				transform: translateY(0);
				pointer-events: none;
			}
			.fade-exit-active {
				opacity: 0;
				transform: translateY(-10px);
				transition: all 0.3s ease;
				pointer-events: none;
			}

			@keyframes pop-in {
				0% {
					transform: scale(0.5);
					opacity: 0;
				}
				70% {
					transform: scale(1.1);
					opacity: 1;
				}
				100% {
					transform: scale(1);
					opacity: 1;
				}
			}
			.animate-pop {
				animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
			}

			@keyframes shake {
				0%,
				100% {
					transform: translateX(0);
				}
				20% {
					transform: translateX(-6px);
				}
				40% {
					transform: translateX(6px);
				}
				60% {
					transform: translateX(-4px);
				}
				80% {
					transform: translateX(4px);
				}
			}
			.animate-shake {
				animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
			}

			#map-root {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				z-index: 1;
				background-color: #121212;
			}

			#map {
				width: 100%;
				height: 100%;
				background-color: #121212;
				cursor: crosshair;
				z-index: 1;
			}
		</style>
	</head>
	<body>
		<!-- MAPA -->
		<div id="map-root">
			<div id="map"></div>
		</div>

		<!-- INTERFEJS GRY -->
		<div
			id="game-ui"
			class="hidden fixed inset-0 z-40 flex-col pointer-events-none ui-layer"
		>
			<!-- Górny Pasek (HUD) -->
			<div
				id="map-controls"
				class="w-full p-2 md:p-4 flex justify-between items-start pointer-events-none"
			>
				<!-- Lewa strona: Tryb i Filtry nauki -->
				<div class="flex flex-col gap-2 pointer-events-auto">
					<div
						id="mode-badge"
						class="bg-blue-600 text-white font-black px-3 py-1 md:px-4 md:py-2 rounded-lg text-[10px] md:text-sm uppercase tracking-widest shadow-lg shadow-blue-500/30 w-max"
					>
						WYZWANIE
					</div>

					<!-- Filtry w trybie nauki -->
					<div
						id="study-filters"
						class="hidden flex-col gap-1.5 bg-slate-900/90 backdrop-blur-sm p-2 md:p-3 rounded-xl border border-slate-700 shadow-xl"
					>
						<label class="flex items-center gap-2 cursor-pointer">
							<input
								type="checkbox"
								checked
								onchange="toggleCategory('nizina')"
								class="w-3 h-3 md:w-4 md:h-4 accent-emerald-500"
							/>
							<span
								class="text-emerald-400 font-bold text-[9px] md:text-xs uppercase tracking-wider"
								>Niziny</span
							>
						</label>
						<label class="flex items-center gap-2 cursor-pointer">
							<input
								type="checkbox"
								checked
								onchange="toggleCategory('wyzyna')"
								class="w-3 h-3 md:w-4 md:h-4 accent-amber-500"
							/>
							<span
								class="text-amber-400 font-bold text-[9px] md:text-xs uppercase tracking-wider"
								>Wyżyny</span
							>
						</label>
						<label class="flex items-center gap-2 cursor-pointer">
							<input
								type="checkbox"
								checked
								onchange="toggleCategory('gory')"
								class="w-3 h-3 md:w-4 md:h-4 accent-rose-500"
							/>
							<span
								class="text-rose-400 font-bold text-[9px] md:text-xs uppercase tracking-wider"
								>Góry</span
							>
						</label>
					</div>
				</div>

				<!-- Środek: Statystyki (Test/Powtórka) -->
				<div
					id="stats-panel"
					class="absolute top-2 left-1/2 -translate-x-1/2 md:top-4 bg-slate-900/90 backdrop-blur-md px-4 py-2 md:px-8 md:py-3 rounded-xl md:rounded-2xl border border-slate-700 shadow-2xl flex gap-4 md:gap-8 items-center pointer-events-auto transition-all"
				>
					<div class="flex flex-col items-end md:items-center">
						<span
							class="text-[8px] md:text-[9px] uppercase font-bold text-slate-500 tracking-widest"
							>Czas</span
						>
						<span
							id="hud-time"
							class="text-base md:text-xl font-black text-emerald-400 leading-none"
							>00:00</span
						>
					</div>
					<div class="flex flex-col items-end md:items-center">
						<span
							class="text-[8px] md:text-[9px] uppercase font-bold text-slate-500 tracking-widest"
							>Runda</span
						>
						<span
							id="progress-text"
							class="text-base md:text-xl font-black text-white leading-none"
							>1/23</span
						>
					</div>
					<div class="flex flex-col items-end md:items-center">
						<span
							class="text-[8px] md:text-[9px] uppercase font-bold text-slate-500 tracking-widest"
							>Wynik</span
						>
						<span
							id="score-text"
							class="text-base md:text-xl font-black text-blue-400 leading-none"
							>0</span
						>
					</div>
				</div>

				<!-- Prawa strona: Przyciski akcji -->
				<div
					class="flex items-center gap-1 md:gap-2 ml-2 md:ml-0 pointer-events-auto"
				>
					<button
						id="btn-reset-discovered"
						onclick="resetPermanentShapes()"
						class="hidden pointer-events-auto bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 md:px-4 md:py-2 rounded-lg font-bold text-[8px] md:text-sm transition-colors uppercase tracking-wider border border-slate-700"
					>
						Resetuj odkryte
					</button>
					<button
						onclick="endGame(true)"
						class="pointer-events-auto bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 md:px-4 md:py-2 rounded-lg font-bold text-xs md:text-sm transition-colors uppercase tracking-wider border border-slate-700"
					>
						Wyjście
					</button>
				</div>
			</div>

			<!-- Panel Pytania -->
			<div
				id="prompt-container"
				class="pointer-events-auto mx-auto mt-4 md:mt-6 game-card px-4 md:px-8 py-3 md:py-5 rounded-xl md:rounded-2xl text-center transition-all duration-200 border-2 border-slate-700 w-11/12 md:w-auto max-w-lg"
			>
				<p
					class="text-[9px] md:text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] mb-1 md:mb-1"
				>
					Znajdź na mapie
				</p>
				<h2
					id="question-text"
					class="text-2xl md:text-5xl font-black text-white tracking-tight uppercase transition-opacity duration-150"
				>
					Himalaje
				</h2>
				<div
					id="attempts-container"
					class="flex justify-center gap-1.5 md:gap-2 mt-2 md:mt-4"
				>
					<div
						class="w-6 md:w-8 h-1.5 rounded-full bg-slate-700 attempt-dot transition-colors"
					></div>
					<div
						class="w-6 md:w-8 h-1.5 rounded-full bg-slate-700 attempt-dot transition-colors"
					></div>
					<div
						class="w-6 md:w-8 h-1.5 rounded-full bg-slate-700 attempt-dot transition-colors"
					></div>
				</div>
			</div>
		</div>

		<!-- MENU GŁÓWNE -->
		<div
			id="main-menu"
			class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4 fade-enter-active ui-layer overflow-y-auto"
		>
			<div class="w-full max-w-4xl my-auto py-8">
				<div class="text-center mb-8 md:mb-12">
					<h1
						class="text-4xl md:text-7xl font-black text-white italic tracking-tighter drop-shadow-lg"
					>
						ASIA<span class="text-blue-500">CHALLENGE</span>
					</h1>
					<p
						class="text-slate-400 font-semibold tracking-widest uppercase mt-2 text-xs md:text-sm"
					>
						Geograficzna Gra Edukacyjna
					</p>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
					<!-- LEARN MODE -->
					<button
						onclick="startGame('study')"
						class="menu-card rounded-xl md:rounded-2xl p-5 md:p-6 text-left group relative overflow-hidden"
					>
						<div
							class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity"
						>
							<svg
								class="w-16 h-16 md:w-24 md:h-24 text-white"
								fill="currentColor"
								viewBox="0 0 20 20"
							>
								<path
									d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"
								></path>
							</svg>
						</div>
						<h3
							class="text-lg md:text-xl font-black text-white uppercase tracking-wider mb-2 relative z-10"
						>
							Tryb Nauki
						</h3>
						<p
							class="text-slate-400 text-xs md:text-sm font-medium leading-relaxed mb-4 md:mb-6 relative z-10"
						>
							Przeglądaj mapę bez stresu. Wszystkie 23 obiekty są widoczne wraz
							z opisami. Idealne do zapamiętywania przed testem.
						</p>
						<div
							class="inline-block bg-slate-800 text-white font-bold uppercase tracking-wider text-[10px] md:text-xs px-3 md:px-4 py-2 rounded-lg group-hover:bg-blue-500 transition-colors relative z-10"
						>
							Eksploruj
						</div>
					</button>

					<!-- CHALLENGE MODE -->
					<button
						onclick="startGame('test')"
						class="menu-card rounded-xl md:rounded-2xl p-5 md:p-6 text-left group relative overflow-hidden border-blue-500/30"
					>
						<div
							class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity"
						>
							<svg
								class="w-16 h-16 md:w-24 md:h-24 text-white"
								fill="currentColor"
								viewBox="0 0 20 20"
							>
								<path
									fill-rule="evenodd"
									d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
									clip-rule="evenodd"
								></path>
							</svg>
						</div>
						<h3
							class="text-lg md:text-xl font-black text-white uppercase tracking-wider mb-2 relative z-10"
						>
							Test Wiedzy
						</h3>
						<p
							class="text-slate-400 text-xs md:text-sm font-medium leading-relaxed mb-4 md:mb-6 relative z-10"
						>
							Podejmij wyzwanie. Obiekty pojawiają się losowo. Zaznaczaj je na
							mapie tak precyzyjnie, jak potrafisz. Zbieraj punkty.
						</p>
						<div
							class="inline-block bg-blue-600 text-white font-bold uppercase tracking-wider text-[10px] md:text-xs px-3 md:px-4 py-2 rounded-lg group-hover:bg-blue-500 transition-colors shadow-lg shadow-blue-500/30 relative z-10"
						>
							Graj Teraz
						</div>
					</button>

					<!-- REVIEW MODE -->
					<button
						id="btn-review"
						onclick="startGame('review')"
						disabled
						class="menu-card rounded-xl md:rounded-2xl p-5 md:p-6 text-left group relative overflow-hidden opacity-50 cursor-not-allowed"
					>
						<div
							class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity"
						>
							<svg
								class="w-16 h-16 md:w-24 md:h-24 text-white"
								fill="currentColor"
								viewBox="0 0 20 20"
							>
								<path
									fill-rule="evenodd"
									d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
									clip-rule="evenodd"
								></path>
							</svg>
						</div>
						<h3
							class="text-lg md:text-xl font-black text-white uppercase tracking-wider mb-2 relative z-10"
						>
							Powtórka
						</h3>
						<p
							id="review-desc"
							class="text-slate-400 text-xs md:text-sm font-medium leading-relaxed mb-4 md:mb-6 relative z-10"
						>
							Rozwiąż test, aby odblokować możliwość powtórzenia błędnie
							zaznaczonych krain.
						</p>
						<div
							class="inline-block bg-slate-800 text-slate-400 font-bold uppercase tracking-wider text-[10px] md:text-xs px-3 md:px-4 py-2 rounded-lg transition-colors relative z-10"
						>
							Niedostępne
						</div>
					</button>
				</div>

				<div class="mt-8 md:mt-12 text-center">
					<p
						class="text-slate-600 text-[10px] md:text-xs font-bold uppercase tracking-[0.3em]"
					>
						Made by susek
					</p>
				</div>
			</div>
		</div>

		<!-- EKRAN KOŃCOWY POPUP -->
		<div
			id="end-screen"
			class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 ui-layer"
		>
			<div
				class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden animate-pop"
			>
				<!-- Główne statystyki (góra) -->
				<div
					class="p-6 md:p-8 bg-slate-800/50 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center gap-6"
				>
					<div class="text-center md:text-left">
						<p
							class="text-blue-500 text-[10px] font-bold uppercase tracking-[0.3em] mb-1"
						>
							Podsumowanie
						</p>
						<h2
							class="text-3xl md:text-5xl font-black text-white italic tracking-tighter drop-shadow-lg"
						>
							WYNIKI
						</h2>
					</div>

					<div class="flex items-center gap-6">
						<div class="text-center">
							<p
								class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1"
							>
								Twój Wynik
							</p>
							<div
								id="end-score"
								class="text-5xl font-black text-white leading-none tracking-tighter"
							>
								0<span class="text-2xl text-slate-500">/23</span>
							</div>
						</div>
						<div class="w-px h-12 bg-slate-700"></div>
						<div class="text-center">
							<p
								class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1"
							>
								Czas Gry
							</p>
							<div
								id="end-time"
								class="text-3xl font-black text-emerald-400 leading-none"
							>
								00:00
							</div>
						</div>
					</div>
				</div>

				<!-- Przewijana, kompaktowa lista i małe statystyki -->
				<div class="flex-1 overflow-y-auto max-h-[45vh] p-6 bg-slate-900/50">
					<div class="grid grid-cols-3 gap-4 mb-6">
						<div
							class="bg-slate-800 rounded-xl p-3 border border-blue-500/20 text-center"
						>
							<span
								id="end-percentage"
								class="text-xl md:text-2xl font-black text-blue-400 block leading-none mb-1"
								>0%</span
							>
							<span
								class="text-[9px] text-slate-400 font-bold uppercase tracking-wider"

			// Zmienne stanu gry
			let map;

			window.onload = function () {
				initMap();

			function initMap() {
				map = L.map('map', {
					center: [45, 90],
					zoom: 3,
					minZoom: 2,
					maxZoom: 10,
					maxBounds: [
						[-20, 20],
						[90, 180]
					],
					maxBoundsViscosity: 1.0,
					zoomControl: false
				});

				L.control.zoom({ position: 'bottomright' }).addTo(map);

				L.tileLayer(
					'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
					{
						attribution:
							'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
						maxZoom: 17
					}
				).addTo(map);

				map.on('click', handleMapClick);
			}

			function resetMapView() {
				map.setView([45, 90], 3, { animate: true, duration: 1 });
			}

			// Ray-casting
			function isPointInPolygon(point, vs) {
				let x = point[1],
					y = point[0];
				let inside = false;
				for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
					let xi = vs[i][1],
						yi = vs[i][0];
					let xj = vs[j][1],
						yj = vs[j][0];

					let intersect =
						yi > y != yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
					if (intersect) inside = !inside;
				}
				return inside;
			}

			function shuffleArray(array) {
				let curId = array.length;
				while (0 !== curId) {
					let randId = Math.floor(Math.random() * curId);
					curId -= 1;
					let tmp = array[curId];
					array[curId] = array[randId];
					array[randId] = tmp;
				}
				return array;
			}

			function setClass(id, className, remove = false) {
				const el = document.getElementById(id);
				if (el) {
					if (remove) el.classList.remove(className);
					else el.classList.add(className);
				}
			}

			function startTimer() {
				clearInterval(timerInterval);
				elapsedSeconds = 0;
				updateTimerUI();
				timerInterval = setInterval(() => {
					elapsedSeconds++;
					updateTimerUI();
				}, 1000);
			}

			function stopTimer() {
				clearInterval(timerInterval);
			}

			function updateTimerUI() {
				const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
				const secs = String(elapsedSeconds % 60).padStart(2, '0');
				const timeStr = `${mins}:${secs}`;

				const endTimerEl = document.getElementById('end-time');
				const hudTimerEl = document.getElementById('hud-time');

				if (endTimerEl) endTimerEl.textContent = timeStr;
				if (hudTimerEl) hudTimerEl.textContent = timeStr;
			}

			// Obsługa modala wyników
			function closeEndPopup() {
				const endScreen = document.getElementById('end-screen');
				const inspectControls = document.getElementById('inspect-controls');
				if (endScreen && inspectControls) {
					endScreen.classList.remove('flex');
					endScreen.classList.add('hidden');
					inspectControls.classList.remove('hidden');
					inspectControls.classList.add('flex');
				}
			}

			function openEndPopup() {
				const endScreen = document.getElementById('end-screen');
				const inspectControls = document.getElementById('inspect-controls');
				if (endScreen && inspectControls) {
					endScreen.classList.remove('hidden');
					endScreen.classList.add('flex');
					inspectControls.classList.remove('flex');
					inspectControls.classList.add('hidden');
				}
			}

			function moveMapToRoot() {
				const mapEl = document.getElementById('map');
				const root = document.getElementById('map-root');
				if (mapEl && root && mapEl.parentNode !== root) {
					root.appendChild(mapEl);
					map.invalidateSize();
				}
			}

			function showMenu() {
				stopTimer();
				moveMapToRoot();

				// Bezpieczne ukrywanie ekranu końcowego i paska kontroli
				const endScreen = document.getElementById('end-screen');
				const inspectControls = document.getElementById('inspect-controls');
				if (endScreen) {
					endScreen.classList.add('hidden');
					endScreen.classList.remove('flex');
				}
				if (inspectControls) {
					inspectControls.classList.add('hidden');
					inspectControls.classList.remove('flex');
				}

				setClass('main-menu', 'hidden', true);
				setClass('main-menu', 'fade-exit', true);
				setClass('main-menu', 'fade-enter-active');

				setClass('game-ui', 'flex', true);
				setClass('game-ui', 'hidden');
				document.getElementById('map-controls').classList.add('hidden');

				clearMapOverlays();
				resetPermanentShapes();
				clearStudyMarkers();

				const btnReview = document.getElementById('btn-review');
				const reviewDesc = document.getElementById('review-desc');
				if (btnReview && reviewDesc) {
					const reviewBtnEl = btnReview.querySelector('.inline-block');

					if (previousMistakes.length > 0) {
						btnReview.disabled = false;
						btnReview.classList.remove('opacity-50', 'cursor-not-allowed');
						btnReview.classList.add('border-orange-500/50');
						reviewDesc.textContent = `Masz ${previousMistakes.length} obiektów, które sprawiły problem. Czas je utrwalić.`;
						reviewDesc.classList.add('text-orange-200');
						if (reviewBtnEl) {
							reviewBtnEl.textContent = 'Powtórz';
							reviewBtnEl.className =
								'inline-block bg-orange-600 text-white font-bold uppercase tracking-wider text-xs px-4 py-2 rounded-lg group-hover:bg-orange-500 transition-colors shadow-lg shadow-orange-600/30';
						}
					} else {
						btnReview.disabled = true;
						btnReview.classList.add('opacity-50', 'cursor-not-allowed');
						btnReview.classList.remove('border-orange-500/50');
						reviewDesc.textContent = `Rozwiąż test, aby odblokować możliwość powtórzenia błędnie zaznaczonych krain.`;
						reviewDesc.classList.remove('text-orange-200');
						if (reviewBtnEl) {
							reviewBtnEl.textContent = 'Niedostępne';
							reviewBtnEl.className =
								'inline-block bg-slate-800 text-slate-400 font-bold uppercase tracking-wider text-xs px-4 py-2 rounded-lg transition-colors';
						}
					}
				}
			}

			function startGame(mode) {
				moveMapToRoot();

				currentMode = mode;
				score = 0;
				currentIndex = 0;
				mistakesList = [];
				locationStats = {};
				clearMapOverlays();
				resetPermanentShapes();
				clearStudyMarkers();
				stopTimer();
				elapsedSeconds = 0;
				updateTimerUI();

				const modeBadge = document.getElementById('mode-badge');

				if (mode === 'study') {
					document.getElementById('study-filters').classList.remove('hidden');
					document.getElementById('study-filters').classList.add('flex');
					document.getElementById('stats-panel').classList.add('hidden');
					document.getElementById('prompt-container').classList.add('hidden');
					if (modeBadge) modeBadge.textContent = 'TRYB NAUKI';

					document
						.querySelectorAll('#study-filters input')
						.forEach((input) => (input.checked = true));
					visibleCategories = { nizina: true, wyzyna: true, gory: true };

					renderStudyMarkers();
				} else {
					document.getElementById('study-filters').classList.add('hidden');
					document.getElementById('study-filters').classList.remove('flex');
					document.getElementById('stats-panel').classList.remove('hidden');
					document
						.getElementById('prompt-container')
						.classList.remove('hidden');

					if (mode === 'test') {
						queue = shuffleArray([...ALL_LOCATIONS]);
						if (modeBadge) modeBadge.textContent = 'WYZWANIE';
					} else if (mode === 'review') {
						queue = shuffleArray([...previousMistakes]);
						if (modeBadge) modeBadge.textContent = 'POWTÓRKA';
					}
				}

				setClass('main-menu', 'fade-enter-active', true);
				setClass('main-menu', 'fade-exit');
				setTimeout(() => setClass('main-menu', 'hidden'), 300);

				setTimeout(() => {
					setClass('game-ui', 'hidden', true);
					setClass('game-ui', 'flex');
					document.getElementById('map-controls').classList.remove('hidden');
				}, 300);

				resetMapView();

				if (mode !== 'study') {
					updateScoreUI();
					askQuestion();
					startTimer();
				}
			}

			function toggleCategory(cat) {
				visibleCategories[cat] = !visibleCategories[cat];
				renderStudyMarkers();
			}

			function clearStudyMarkers() {
				studyMarkers.forEach((m) => map.removeLayer(m));
				studyMarkers = [];
			}

			function renderStudyMarkers() {
				clearStudyMarkers();
				if (currentMode !== 'study') return;

				ALL_LOCATIONS.forEach((loc) => {
					if (visibleCategories[loc.type]) {
						const color = TYPE_COLORS[loc.type];

						const polygon = L.polygon(loc.polygon, {
							color: color,
							weight: 2,
							fillColor: color,
							fillOpacity: 0.15,
							interactive: true
						}).addTo(map);

						const dot = L.circleMarker(loc.center, {
							color: color,
							fillColor: color,
							fillOpacity: 1,
							radius: 5,
							weight: 1,
							interactive: true
						}).addTo(map);

						polygon.bindTooltip(loc.name, {
							permanent: true,
							direction: 'center',
							className: 'study-label'
						});

						studyMarkers.push(polygon);
						studyMarkers.push(dot);
					}
				});
			}

			function updateScoreUI() {
				document.getElementById('score-text').textContent = score;
			}

			function askQuestion() {
				// Główny warunek zakończenia gry
				if (currentIndex >= queue.length) {
					endGame(false);
					return;
				}

				clearMapOverlays();
				currentAttempts = 0;
				updateAttemptsUI();

				const currentObj = queue[currentIndex];
				const promptBox = document.getElementById('prompt-container');
				const questionText = document.getElementById('question-text');

				document.getElementById('progress-text').textContent =
					`${currentIndex + 1}/${queue.length}`;

				// Ultra płynne przejście
				questionText.style.opacity = '0';
				setTimeout(() => {
					questionText.textContent = currentObj.name;
					questionText.style.opacity = '1';

					promptBox.classList.remove('animate-pop');
					void promptBox.offsetWidth;
					promptBox.classList.add('animate-pop');

					isWaitingForClick = true;
				}, 150);
			}

			function updateAttemptsUI() {
				const dots = document.querySelectorAll('.attempt-dot');
				dots.forEach((dot, index) => {
					dot.className =
						'w-6 md:w-8 h-1.5 rounded-full transition-colors duration-300 attempt-dot ';
					if (index < currentAttempts) {
						dot.classList.add('bg-rose-500');
					} else {
						dot.classList.add('bg-slate-700');
					}
				});
			}

			function handleMapClick(e) {
				if (!isWaitingForClick) return;

				const targetObj = queue[currentIndex];
				const clickPoint = [e.latlng.lat, e.latlng.lng];

				const isCorrect = isPointInPolygon(clickPoint, targetObj.polygon);

				if (isCorrect) {
					handleCorrectAnswer(targetObj);
				} else {
					handleWrongAnswer(targetObj, e.latlng);
				}
			}

			function drawShape(
				polygonPoints,
				color,
				isFill = false,
				targetArray = activeShapes
			) {
				const shape = L.polygon(polygonPoints, {
					color: color,
					weight: 2,
					fillColor: color,
					fillOpacity: isFill ? 0.2 : 0.0,
					interactive: false
				}).addTo(map);
				targetArray.push(shape);
				return shape;
			}

			function drawMissDot(latLng) {
				const dot = L.circleMarker(latLng, {
					color: '#e11d48',
					fillColor: '#f43f5e',
					fillOpacity: 0.8,
					radius: 4,
					weight: 2,
					interactive: false
				}).addTo(map);
				activeShapes.push(dot);
			}

			function handleCorrectAnswer(targetObj) {
				isWaitingForClick = false;

				if (currentAttempts === 0) {
					score++;
				}
				updateScoreUI();

				locationStats[targetObj.id] = {
					status: 'correct',
					attempts: currentAttempts + 1
				};

				const color = COLORS[currentAttempts] || COLORS[2];

				drawShape(targetObj.polygon, color, true, permanentShapes);

				const dot = L.circleMarker(targetObj.center, {
					color: color,
					fillColor: color,
					fillOpacity: 1,
					radius: 6,
					weight: 2,
					interactive: false
				}).addTo(map);
				permanentShapes.push(dot);

				const label = L.tooltip({
					permanent: true,
					direction: 'center',
					className: 'study-label'
				})
					.setLatLng(targetObj.center)
					.setContent(targetObj.name)
					.addTo(map);
				permanentShapes.push(label);

				document
					.getElementById('btn-reset-discovered')
					.classList.remove('hidden');

				const promptBox = document.getElementById('prompt-container');
				promptBox.classList.add('border-emerald-500', 'bg-emerald-900/40');

				setTimeout(() => {
					promptBox.classList.remove('border-emerald-500', 'bg-emerald-900/40');
					currentIndex++;
					askQuestion();
				}, 300);
			}

			function handleWrongAnswer(targetObj, clickLatLng) {
				currentAttempts++;
				updateAttemptsUI();
				drawMissDot(clickLatLng);

				const promptBox = document.getElementById('prompt-container');

				if (currentAttempts >= 3) {
					isWaitingForClick = false;

					if (!mistakesList.some((m) => m.id === targetObj.id)) {
						mistakesList.push(targetObj);
					}

					locationStats[targetObj.id] = { status: 'failed', attempts: 3 };

					drawShape(targetObj.polygon, COLORS[2], true, permanentShapes);

					const correctDot = L.circleMarker(targetObj.center, {
						color: COLORS[2],
						fillColor: COLORS[2],
						fillOpacity: 1,
						radius: 6,
						weight: 2,
						interactive: false
					}).addTo(map);
					permanentShapes.push(correctDot);

					const label = L.tooltip({
						permanent: true,
						direction: 'center',
						className: 'study-label'
					})
						.setLatLng(targetObj.center)
						.setContent(targetObj.name)
						.addTo(map);
					permanentShapes.push(label);

					document
						.getElementById('btn-reset-discovered')
						.classList.remove('hidden');

					promptBox.classList.add('border-rose-500', 'bg-rose-900/40');
					map.panTo(targetObj.center, { animate: true, duration: 0.3 });

					setTimeout(() => {
						promptBox.classList.remove('border-rose-500', 'bg-rose-900/40');
						currentIndex++;
						askQuestion();
					}, 350);
				} else {
					promptBox.classList.remove('animate-shake');
					void promptBox.offsetWidth;
					promptBox.classList.add('animate-shake', 'border-rose-500');
					setTimeout(() => promptBox.classList.remove('border-rose-500'), 300);
				}
			}

			function clearMapOverlays() {
				activeShapes.forEach((shape) => map.removeLayer(shape));
				activeShapes = [];
			}

			function resetPermanentShapes() {
				permanentShapes.forEach((shape) => map.removeLayer(shape));
				permanentShapes = [];
				document.getElementById('btn-reset-discovered').classList.add('hidden');
			}

			function endGame(forced = false) {
				isWaitingForClick = false;
				stopTimer();

				// Ukrywanie elementów interfejsu (HUD)
				setClass('game-ui', 'flex', true);
				setClass('game-ui', 'hidden');
				document.getElementById('map-controls').classList.add('hidden');

				if (forced || currentMode === 'study') {
					showMenu();
					return;
				}

				// Bezpieczne, synchroniczne wyświetlanie End Screen jako Popup
				const endScreen = document.getElementById('end-screen');
				if (endScreen) {
					endScreen.classList.remove('hidden');
					endScreen.classList.add('flex');
				}

				// Ukrycie paska analizy (na wypadek gdyby został po re-play)
				const inspectControls = document.getElementById('inspect-controls');
				if (inspectControls) {
					inspectControls.classList.add('hidden');
					inspectControls.classList.remove('flex');
				}

				// Generowanie podsumowania i wyników
				try {
					const totalQuestions = queue.length;
					const percentage = Math.round((score / totalQuestions) * 100) || 0;

					document.getElementById('end-score').innerHTML =
						`${score}<span class="text-2xl text-slate-500">/${totalQuestions}</span>`;

					const percentageEl = document.getElementById('end-percentage');

					if (percentageEl) percentageEl.textContent = `${percentage}%`;

					if (percentage >= 90) {
						if (percentageEl)
							percentageEl.className =
								'text-xl md:text-2xl font-black text-emerald-400 block leading-none mb-1';
					} else if (percentage >= 50) {
						if (percentageEl)
							percentageEl.className =
								'text-xl md:text-2xl font-black text-orange-400 block leading-none mb-1';
					} else {
						if (percentageEl)
							percentageEl.className =
								'text-xl md:text-2xl font-black text-rose-500 block leading-none mb-1';
					}

					let correctCount = 0;
					let failedCount = 0;
					Object.values(locationStats).forEach((stat) => {
						if (stat.status === 'correct') correctCount++;
						else failedCount++;
					});

					document.getElementById('end-correct-count').textContent =
						correctCount;
					document.getElementById('end-failed-count').textContent = failedCount;

					if (currentMode === 'test' || currentMode === 'review') {
						previousMistakes = [...mistakesList];
					}

					const btnReview = document.getElementById('end-btn-review');
					if (btnReview) {
						if (previousMistakes.length > 0) {
							btnReview.classList.remove('hidden');
						} else {
							btnReview.classList.add('hidden');
						}
					}

					// Generowanie Listy Obiektów
					const listContainer = document.getElementById('end-list');
					if (listContainer) {
						listContainer.innerHTML = '';

						queue.forEach((loc, idx) => {
							const stat = locationStats[loc.id] || {
								status: 'failed',
								attempts: 3
							};
							const isCorrect = stat.status === 'correct';

							let dotsHtml = '';
							for (let i = 0; i < 3; i++) {
								let dotClass = 'bg-slate-700';
								if (i < stat.attempts) {
									if (isCorrect && i === stat.attempts - 1) {
										dotClass =
											stat.attempts === 1 ? 'bg-emerald-500' : 'bg-orange-500';
									} else {
										dotClass = 'bg-rose-500';
									}
								}
								dotsHtml += `<div class="w-2 h-2 rounded-full ${dotClass}"></div>`;
							}

							const row = document.createElement('div');
							row.className = `flex flex-col md:flex-row justify-between items-start md:items-center p-2 md:p-3 rounded-lg border ${isCorrect ? 'border-emerald-500/30 bg-emerald-900/10' : 'border-rose-500/30 bg-rose-900/10'}`;
							row.innerHTML = `
                            <div class="flex items-center gap-2 w-full md:w-auto mb-1 md:mb-0">
                                <div class="font-bold text-slate-500 w-5 text-right text-xs">${idx + 1}.</div>
                                <div class="font-bold text-xs md:text-sm ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${loc.name}</div>
                            </div>
                            <div class="flex items-center justify-between md:justify-end w-full md:w-auto gap-3 md:gap-4 pl-7 md:pl-0">
                                <div class="flex gap-1">${dotsHtml}</div>
                                <div class="text-[9px] md:text-[10px] font-bold uppercase tracking-wider ${isCorrect ? 'text-emerald-500' : 'text-rose-500'} w-20 text-right">
                                    ${isCorrect ? 'Odgadnięto' : 'Odkryto Auto'}
                                </div>
                            </div>
                        `;
							listContainer.appendChild(row);
						});
					}

					// Centrowanie mapy w tle pod popupem
					if (permanentShapes.length > 0) {
						const validShapesForBounds = permanentShapes.filter(
							(shape) =>
								typeof shape.getBounds === 'function' ||
								typeof shape.getLatLng === 'function'
						);

						if (validShapesForBounds.length > 0) {
							const group = L.featureGroup(validShapesForBounds);
							map.fitBounds(group.getBounds(), {
								padding: [50, 50],
								animate: true,
								duration: 1.5
							});
						}
					}
				} catch (error) {
					console.error(
						'Wystąpił błąd podczas generowania podsumowania: ',
						error
					);
				}
			}
		</script>
